name: spellcheck
on:
  push:
    branches: [main]
  pull_request:
# The SARIF upload to code scanning needs the explicit write grant
# (push-event tokens were refused without it - 'Resource not
# accessible by integration' - while pull-request runs uploaded fine).
permissions:
  contents: read
  security-events: write

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kotoshu/action-kotoshu@v2
        with:
          files: "."
          language: en
          baseline: .kotoshu-baseline.json
          format: sarif
